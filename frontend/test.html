<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆信息录入系统 - 测试页面</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-8">
            🚗 车辆信息录入系统
        </h1>

        <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">上传车辆图片</h2>

            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <label for="imageInput" class="cursor-pointer">
                    <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p class="mt-4 text-sm text-gray-600">
                        <span class="text-blue-600 font-medium">点击上传</span> 或拖拽图片到此处
                    </p>
                    <p class="text-xs text-gray-500 mt-2">支持 PNG, JPG, GIF 格式，最大 10MB</p>
                </label>
            </div>

            <div id="preview" class="mt-4 hidden">
                <img id="previewImg" class="max-h-64 mx-auto rounded-lg">
            </div>

            <div id="loading" class="hidden mt-4 text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                <p class="mt-4 text-sm text-gray-600">AI 识别中...</p>
            </div>

            <div id="error" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
                <p class="text-sm text-red-600"></p>
            </div>
        </div>

        <div id="formSection" class="hidden max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-6">车辆信息</h2>

            <form id="vehicleForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">品牌</span>
                        <span id="badge-brand" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="text" id="brand" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">车型</span>
                        <span id="badge-model" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="text" id="model" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">年款</span>
                        <span id="badge-year" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="number" id="year" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">颜色</span>
                        <span id="badge-color" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="text" id="color" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">里程 (km)</span>
                        <span id="badge-mileage" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="number" id="mileage" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">排量</span>
                        <span id="badge-displacement" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="text" id="displacement" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">马力</span>
                        <span id="badge-horsepower" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="number" id="horsepower" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">变速箱</span>
                        <span id="badge-transmission" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="text" id="transmission" class="w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium text-gray-700">驱动方式</span>
                        <span id="badge-drive_type" class="px-2 py-1 rounded-full text-xs font-medium">-</span>
                    </label>
                    <input type="text" id="drive_type" class="w-full px-3 py-2 border rounded-md">
                </div>
            </form>

            <div class="bg-blue-50 border border-blue-200 rounded-md p-4 mt-5">
                <p class="text-sm text-blue-700">
                    <strong>识别说明：</strong>
                    🟢 绿色 = 高置信度 |
                    🟡 黄色 = 中等置信度 |
                    🔴 红色 = 低置信度或需手动填写
                </p>
            </div>

            <div class="flex justify-end space-x-4 mt-6">
                <button type="button" onclick="location.reload()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    重新开始
                </button>
                <button type="submit" form="vehicleForm" class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    保存信息
                </button>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const formSection = document.getElementById('formSection');

        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 显示预览
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            // 显示加载状态
            loading.classList.remove('hidden');
            errorDiv.classList.add('hidden');

            // 上传识别
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('http://localhost:3001/api/vehicle/recognize', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                loading.classList.add('hidden');

                if (result.success) {
                    // 填充表单
                    fillForm(result.data);
                    formSection.classList.remove('hidden');
                } else {
                    showError(result.error || '识别失败');
                }
            } catch (error) {
                loading.classList.add('hidden');
                showError('网络请求失败: ' + error.message);
            }
        });

        function fillForm(data) {
            const fields = ['brand', 'model', 'year', 'color', 'mileage', 'displacement', 'horsepower', 'transmission', 'drive_type'];

            fields.forEach(field => {
                const fieldData = data[field] || { value: '', confidence: 'low' };
                const input = document.getElementById(field);
                const badge = document.getElementById('badge-' + field);

                input.value = fieldData.value || '';

                // 设置置信度标签
                const confidenceStyles = {
                    high: { bg: 'bg-green-100', text: 'text-green-800', label: '高' },
                    medium: { bg: 'bg-yellow-100', text: 'text-yellow-800', label: '中' },
                    low: { bg: 'bg-red-100', text: 'text-red-800', label: '低' }
                };

                const style = confidenceStyles[fieldData.confidence] || confidenceStyles.low;
                badge.className = `px-2 py-1 rounded-full text-xs font-medium ${style.bg} ${style.text}`;
                badge.textContent = style.label;

                // 设置输入框背景色
                input.className = `w-full px-3 py-2 border rounded-md ${style.bg.replace('100', '50')}`;
            });
        }

        function showError(message) {
            errorDiv.querySelector('p').textContent = message;
            errorDiv.classList.remove('hidden');
        }

        document.getElementById('vehicleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('数据已保存（请查看浏览器控制台）');
            const formData = new FormData(e.target);
            console.log('保存的数据:', Object.fromEntries(formData));
        });
    </script>
</body>
</html>
